<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E"
    />
    <title>秋笙·项目管理</title>
    <script>
      // 纯前端登录门：未登录跳到 admin-login.html（演示用，正式项目由后端鉴权）
      if (localStorage.getItem('qs_auth') !== '1') {
        location.replace('admin-login.html');
      } else {
        window.addEventListener('load', () => {
          const b = document.createElement('button');
          b.textContent = '退出登录';
          b.style.cssText = 'position:fixed;right:18px;bottom:18px;z-index:9999;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(124,92,255,.28);color:#fff;cursor:pointer;font-size:13px;backdrop-filter:blur(8px)';
          b.onclick = () => { localStorage.removeItem('qs_auth'); location.href = 'admin-login.html'; };
          document.body.appendChild(b);
        });
      }
    </script>
    <script type="module" crossorigin src="index-swDuGYcM.js"></script>
    <link rel="stylesheet" crossorigin href="index-ITOwe4uo.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
